<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-snap-type: y mandatory;
        /* scroll-behavior: smooth; */
      }

      section,
      footer {
        border: 2px solid red;
        padding: 2rem;
        scroll-snap-align: start;
        scroll-margin-top: 60px;
        height: calc(100vh - 60px);
      }

      section.hero {
        margin-top: 60px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      .menu-icon,
      .close-icon {
        padding: 10px;
      }

      .icons {
        display: none;
      }
      #checkbox {
        display: none;
      }

      .menu-icon:hover,
      .close-icon:hover {
        cursor: pointer;
      }

      .header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 999;
      }

      .header-container {
        padding: 0 2rem;

        max-width: 1200px;
        margin: 0 auto;

        display: flex;
        align-items: center;
        justify-content: space-between;

        height: 60px;
        border: 5px solid blue;
      }

      .navbar__list {
        height: 100%;
        list-style: none;
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .navbar__link {
        text-decoration: none;
        padding: 10px 15px;
      }
      .navbar__link:hover {
        text-decoration: underline;
      }

      @media (max-width: 540px) {
        .icons {
          display: block;
        }
        #checkbox:checked ~ .icons .menu-icon {
          display: none;
        }
        .icons .close-icon {
          display: none;
        }
        #checkbox:checked ~ .icons .close-icon {
          display: block;
        }

        .navbar {
          position: absolute;
          top: 100%;
          left: 0;
          height: 0;
          width: 100%;
          background-color: antiquewhite;
          overflow: hidden;
          transition: 0.3s ease;
        }

        .navbar__list {
          font-size: 1.5rem;
          display: flex;
          flex-direction: column;
          justify-content: space-evenly;
        }

        #checkbox:checked ~ .navbar {
          height: calc(100vh - 60px);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="header-container">
          <img src="#" alt="LOGO" />

          <input type="checkbox" id="checkbox" />
          <label for="checkbox" class="icons">
            <span class="menu-icon">☰</span>
            <span class="close-icon">x</span>
          </label>

          <nav class="navbar">
            <ul class="navbar__list">
              <li class="navbar__item">
                <a class="navbar__link" href="#">H</a>
              </li>
              <li class="navbar__item">
                <a class="navbar__link" href="#">H</a>
              </li>
            </ul>
          </nav>
        </div>
      </header>

      <main>
        <section id="hero" class="hero">hero</section>
        <section id="hero" class="hero">hero</section>
      </main>
      <footer>footer</footer>
    </div>

    <script>
      document.querySelectorAll(".navbar a").forEach((link) => {
        link.addEventListener("click", () => {
          document.getElementById("checkbox").checked = false;
        });
      });
    </script>
  </body>
</html>
